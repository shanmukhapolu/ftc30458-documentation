<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings | FTC 30458 Engineering Log</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/app.css">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
</head>
<body>
  <div id="app-shell"></div>

  <script type="module">
    import { requireAuth, attachLogout, getUserProfile, saveUserProfile, sendResetPasswordEmail } from "./js/auth.js?v=20260918-03";
    import { renderShell } from "./js/shell.js?v=20260918-03";
    import { showToast } from "./js/ui.js?v=20260918-03";

    const roles = [
      "Team Lead",
      "Mechanical",
      "CAD",
      "Programming",
      "Electrical",
      "Autonomous",
      "Vision",
      "Testing",
      "Strategy",
      "Outreach / Sponsorship",
      "Media / PR",
      "Multi-disciplinary",
      "Other"
    ];

    requireAuth(async function(user) {
      renderShell({ active:"settings", title:"Settings", user:user });

      const page = document.getElementById("page-content");
      page.innerHTML =
        '<section class="page-header">' +
          '<div class="page-header-row">' +
            '<div class="page-header-copy">' +
              '<div class="eyebrow">Account</div>' +
              '<h2 class="page-title">Settings</h2>' +
              '<p class="page-subtitle">Manage the team profile attached to your account. Changes appear across the documentation workspace automatically.</p>' +
            '</div>' +
          '</div>' +
        '</section>' +

        '<div class="log-layout">' +
          '<div>' +
            '<section class="card-shell" style="padding:24px;margin-bottom:18px">' +
              '<div class="section-head"><div><h2>Profile</h2><p>Your name and primary role are visible to other team members.</p></div><span id="profile-status" class="chip chip-neutral">Loading</span></div>' +
              '<form id="settings-form">' +
                '<div class="form-row">' +
                  '<div class="form-group"><label class="form-label" for="settings-name">Name</label><input id="settings-name" class="form-input" autocomplete="name" required></div>' +
                  '<div class="form-group"><label class="form-label" for="settings-role">Primary role</label><select id="settings-role" class="form-select" required><option value="">Select a role</option>' +
                    roles.map(role => '<option value="'+role.replaceAll('"','&quot;')+'">'+role.replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")+'</option>').join("") +
                  '</select></div>' +
                '</div>' +
                '<div class="form-group"><label class="form-label" for="settings-email">Account email</label><input id="settings-email" class="form-input" type="email" readonly></div>' +
                '<div style="display:flex;justify-content:flex-end;gap:10px"><button id="save-profile" class="btn btn-primary" type="submit">Save Changes</button></div>' +
              '</form>' +
            '</section>' +

            '<section class="card-shell" style="padding:24px;margin-bottom:18px">' +
              '<div class="section-head"><div><h2>Password</h2><p>Send a secure password reset link to your account email.</p></div></div>' +
              '<div class="notice notice-warning" style="margin-bottom:14px">A reset link will be sent to <strong id="password-email"></strong>. This does not sign you out.</div>' +
              '<button id="reset-password" class="btn btn-outline" type="button">Send Password Reset Email</button>' +
            '</section>' +

            '<section class="card-shell" style="padding:24px">' +
              '<div class="section-head"><div><h2>Session</h2><p>Sign out of this browser when you are finished.</p></div></div>' +
              '<button id="settings-signout" class="btn btn-outline" type="button">Sign Out</button>' +
            '</section>' +
          '</div>' +

          '<aside class="side-panel">' +
            '<div class="summary-card">' +
              '<div class="eyebrow">Account</div>' +
              '<h3 style="font-size:1rem;margin-bottom:13px">Current profile</h3>' +
              '<div class="summary-stat"><span>Name</span><strong id="summary-name">—</strong></div>' +
              '<div class="summary-stat"><span>Role</span><strong id="summary-role">—</strong></div>' +
              '<div class="summary-stat"><span>Email</span><strong id="summary-email">—</strong></div>' +
              '<div class="form-hint" style="margin-top:15px">Your profile is shared with the team so practice pages can identify who documented each entry.</div>' +
            '</div>' +
          '</aside>' +
        '</div>';

      attachLogout("#settings-signout");

      const nameField = document.getElementById("settings-name");
      const roleField = document.getElementById("settings-role");
      const emailField = document.getElementById("settings-email");
      const passwordEmail = document.getElementById("password-email");
      const profileStatus = document.getElementById("profile-status");
      const saveButton = document.getElementById("save-profile");
      const summaryName = document.getElementById("summary-name");
      const summaryRole = document.getElementById("summary-role");
      const summaryEmail = document.getElementById("summary-email");

      emailField.value = user.email || "";
      passwordEmail.textContent = user.email || "your account email";
      summaryEmail.textContent = user.email || "—";

      function syncSummary(){
        summaryName.textContent = nameField.value.trim() || "—";
        summaryRole.textContent = roleField.value || "—";
      }

      nameField.addEventListener("input", syncSummary);
      roleField.addEventListener("change", syncSummary);

      try {
        const profile = await getUserProfile(user.uid);
        nameField.value = profile?.displayName || user.displayName || "";
        roleField.value = profile?.role || "";
        profileStatus.textContent = profile?.profileComplete ? "Complete" : "Needs setup";
        profileStatus.className = "chip " + (profile?.profileComplete ? "chip-success" : "chip-warning");
        syncSummary();
      } catch (error) {
        console.error("Unable to load settings profile:", error);
        profileStatus.textContent = "Read failed";
        profileStatus.className = "chip chip-danger";
        showToast("Your profile could not be loaded. You can still retry saving.", "error", 7000);
      }

      document.getElementById("settings-form").addEventListener("submit", async function(event) {
        event.preventDefault();
        saveButton.disabled = true;
        saveButton.textContent = "Saving…";

        try {
          await saveUserProfile(user, {
            displayName: nameField.value,
            role: roleField.value
          });
          profileStatus.textContent = "Saved";
          profileStatus.className = "chip chip-success";
          syncSummary();
          showToast("Profile updated.", "success");
        } catch (error) {
          console.error("Unable to save profile:", error);
          showToast(error.message || "Unable to update your profile.", "error", 7000);
        } finally {
          saveButton.disabled = false;
          saveButton.textContent = "Save Changes";
        }
      });

      document.getElementById("reset-password").addEventListener("click", async function(event) {
        const button = event.currentTarget;
        button.disabled = true;
        button.textContent = "Sending…";

        try {
          await sendResetPasswordEmail(user);
          showToast("Password reset email sent.", "success", 5000);
        } catch (error) {
          console.error("Unable to send password reset email:", error);
          showToast(error.message || "Unable to send the reset email.", "error", 7000);
        } finally {
          button.disabled = false;
          button.textContent = "Send Password Reset Email";
        }
      });
    });
  </script>
</body>
</html>
