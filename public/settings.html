<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings | FTC 30458 Engineering Log</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/app.css">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
</head>
<body>
  <div id="app-shell"></div>

  <script type="module">
    import { requireAuth, attachLogout, getUserProfile, saveUserProfile, sendResetPasswordEmail } from "./js/auth.js?v=20260918-03";
    import { renderShell } from "./js/shell.js?v=20260918-03";
    import { showToast } from "./js/ui.js?v=20260918-03";

    requireAuth(async function(user) {
      renderShell({ active:"settings", title:"Settings", user:user });
      document.getElementById("page-content").innerHTML =
        '<section class="page-header"><div class="page-header-copy">' +
          '<div class="eyebrow">Account</div><h2 class="page-title">Settings</h2>' +
          '<p class="page-subtitle">Update your team profile or send yourself a password reset email.</p>' +
        '</div></section>' +

        '<section class="card-shell" style="padding:24px;max-width:760px">' +
          '<div class="section-head"><div><h2>Profile</h2><p>These details are visible to the team.</p></div></div>' +
          '<form id="settings-form">' +
            '<div class="form-group"><label class="form-label" for="settings-name">Name</label><input id="settings-name" class="form-input" required></div>' +
            '<div class="form-group"><label class="form-label" for="settings-role">Primary role</label>' +
              '<select id="settings-role" class="form-select" required>' +
                '<option value="">Select a role</option>' +
                '<option>Team Lead</option><option>Mechanical</option><option>CAD</option><option>Programming</option><option>Electrical</option><option>Autonomous</option><option>Vision</option><option>Testing</option><option>Strategy</option><option>Outreach / Sponsorship</option><option>Media / PR</option><option>Multi-disciplinary</option><option>Other</option>' +
              '</select>' +
            '</div>' +
            '<div class="form-group"><label class="form-label" for="settings-email">Account email</label><input id="settings-email" class="form-input" type="email" readonly></div>' +
            '<button class="btn btn-primary" type="submit">Save Changes</button>' +
          '</form>' +
        '</section>' +

        '<section class="card-shell" style="padding:24px;max-width:760px;margin-top:18px">' +
          '<div class="section-head"><div><h2>Password</h2><p>Send a secure Firebase password reset link to your account email.</p></div></div>' +
          '<button id="reset-password" class="btn btn-outline" type="button">Send Password Reset Email</button>' +
        '</section>';

      attachLogout("#logout-button");

      let profile = null;
      try {
        profile = await getUserProfile(user.uid);
      } catch (error) {
        console.error("Unable to load settings profile:", error);
        showToast("Your profile could not be read. Refresh and try again.", "error", 7000);
      }

      document.getElementById("settings-name").value = profile?.displayName || user.displayName || "";
      document.getElementById("settings-role").value = profile?.role || "";
      document.getElementById("settings-email").value = user.email || "";

      document.getElementById("settings-form").addEventListener("submit", async function(event) {
        event.preventDefault();

        const button = event.currentTarget.querySelector("button[type=submit]");
        button.disabled = true;
        button.textContent = "Saving…";

        try {
          await saveUserProfile(user, {
            displayName: document.getElementById("settings-name").value,
            role: document.getElementById("settings-role").value
          });
          showToast("Profile updated.", "success");
        } catch (error) {
          console.error(error);
          showToast(error.message || "Unable to update profile.", "error");
        } finally {
          button.disabled = false;
          button.textContent = "Save Changes";
        }
      });

      document.getElementById("reset-password").addEventListener("click", async function(event) {
        const button = event.currentTarget;
        button.disabled = true;
        button.textContent = "Sending…";

        try {
          await sendResetPasswordEmail(user);
          showToast("Password reset email sent to " + user.email + ".", "success", 5000);
        } catch (error) {
          console.error(error);
          showToast(error.message || "Unable to send the reset email.", "error", 6000);
        } finally {
          button.disabled = false;
          button.textContent = "Send Password Reset Email";
        }
      });
    });
  </script>
</body>
</html>
