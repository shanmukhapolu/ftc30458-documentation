<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Engineering Log | FTC 30458 MasterMinds</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/app.css?v=20260926-02">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <style>
    body{display:flex;align-items:center;justify-content:center;padding:28px;background:var(--bg-dark)}
    .login-shell{width:min(100%,430px)}
    .login-brand{text-align:center;margin-bottom:28px}
    .login-mark{width:62px;height:62px;margin:0 auto 17px;border-radius:16px;background:var(--primary);color:#fff;display:grid;place-items:center;font-family:"Sora",sans-serif;font-size:19px;font-weight:700;box-shadow:0 15px 35px rgba(255,121,0,.18)}
    .login-brand .eyebrow{margin-bottom:7px}
    .login-brand h1{font-size:2rem}
    .login-brand p{margin-top:8px;font-size:.78rem;color:var(--text-muted)}
    .login-card{padding:28px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-minimal)}
    .login-card h2{font-size:1.15rem}
    .login-card .sub{margin-top:5px;margin-bottom:22px;font-size:.72rem;color:var(--text-muted);line-height:1.55}
    .login-footer{margin-top:17px;text-align:center;color:var(--text-muted);font-size:.63rem}
    .submit-button{width:100%;margin-top:4px}
  </style>
</head>
<body>
  <main class="login-shell">
    <section class="login-brand">
      <div class="login-mark">MM</div>
      <div class="eyebrow">FTC 30458</div>
      <h1>Engineering Log</h1>
      <p>Private team documentation for MasterMinds.</p>
    </section>
    <section class="login-card">
      <h2>Sign in</h2>
      <p class="sub">Continue with your centralized FTC 30458 account. You will be redirected to the team sign-in portal.</p>
      <button id="login-button" class="btn btn-primary submit-button" type="button">Continue to 30458 ID</button>
      <div id="error-message" class="notice notice-danger" role="alert" hidden style="margin-top:12px"></div>
    </section>
    <div class="login-footer">Team members only</div>
  </main>
  <script type="module">
    import { applyTheme } from "./js/theme.js?v=20260926-02";
    import { redirectIfAuthenticated, beginCentralSignIn } from "./js/auth.js?v=20261118-02";
    applyTheme();
    redirectIfAuthenticated("./dashboard.html");
    const button = document.getElementById("login-button");
    button.addEventListener("click", async () => {
      button.disabled = true;
      button.textContent = "Redirecting…";
      try {
        await beginCentralSignIn("/dashboard.html");
      } catch (error) {
        document.getElementById("error-message").textContent = error.message || "Unable to start sign-in.";
        document.getElementById("error-message").hidden = false;
        button.disabled = false;
        button.textContent = "Continue to 30458 ID";
      }
    });
  </script>
</body>
</html>
