<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Engineering Log | FTC 30458 MasterMinds</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/app.css">
  <style>
    body{display:flex;align-items:center;justify-content:center;padding:28px;background:var(--bg-dark)}
    .login-shell{width:min(100%,430px)}
    .login-brand{text-align:center;margin-bottom:28px}
    .login-mark{width:62px;height:62px;margin:0 auto 17px;border-radius:16px;background:var(--primary);color:#fff;display:grid;place-items:center;font-family:"Sora",sans-serif;font-size:19px;font-weight:700;box-shadow:0 15px 35px rgba(255,121,0,.18)}
    .login-brand .eyebrow{margin-bottom:7px}
    .login-brand h1{font-size:2rem}
    .login-brand p{margin-top:8px;font-size:.78rem;color:var(--text-muted)}
    .login-card{padding:28px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-minimal)}
    .login-card h2{font-size:1.15rem}
    .login-card .sub{margin-top:5px;margin-bottom:22px;font-size:.72rem;color:var(--text-muted);line-height:1.55}
    .login-footer{margin-top:17px;text-align:center;color:var(--text-muted);font-size:.63rem}
    .error-message{display:none;margin-top:12px;padding:11px 12px;border-radius:10px;border:1px solid rgba(255,107,107,.14);background:var(--danger-soft);color:var(--danger);font-size:.69rem;line-height:1.5}
    .error-message.visible{display:block}
    .submit-button{width:100%;margin-top:4px}
  </style>
</head>
<body>
  <main class="login-shell">
    <section class="login-brand">
      <div class="login-mark">MM</div>
      <div class="eyebrow">FTC 30458</div>
      <h1>Engineering Log</h1>
      <p>Private team documentation for MasterMinds.</p>
    </section>

    <section class="login-card">
      <h2>Sign in</h2>
      <p class="sub">Use your authorized team account. There is no public account creation.</p>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input class="form-input" id="email" type="email" autocomplete="email" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input class="form-input" id="password" type="password" autocomplete="current-password" placeholder="Your password" required>
        </div>

        <button id="login-button" class="btn btn-primary submit-button" type="submit">Sign In</button>
        <div id="error-message" class="error-message" role="alert"></div>
      </form>
    </section>

    <div class="login-footer">Team members only</div>
  </main>

  <script type="module">
    import { auth } from "./js/firebase.js";
    import { onAuthStateChanged, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    const form = document.getElementById("login-form");
    const button = document.getElementById("login-button");
    const error = document.getElementById("error-message");

    onAuthStateChanged(auth, function(user) {
      if (user) window.location.replace("./dashboard.html");
    });

    form.addEventListener("submit", async function(event) {
      event.preventDefault();
      error.classList.remove("visible");
      button.disabled = true;
      button.textContent = "Signing in…";

      try {
        await signInWithEmailAndPassword(
          auth,
          document.getElementById("email").value.trim(),
          document.getElementById("password").value
        );
        window.location.replace("./dashboard.html");
      } catch (err) {
        console.error(err);
        let message = "Unable to sign in. Check your credentials and try again.";
        if (err.code === "auth/api-key-not-valid") {
          message = "Firebase rejected the web API key. Update the Firebase web app config before testing login.";
        } else if (err.code === "auth/invalid-credential" || err.code === "auth/wrong-password" || err.code === "auth/user-not-found") {
          message = "Incorrect email or password.";
        } else if (err.code === "auth/too-many-requests") {
          message = "Too many unsuccessful attempts. Try again later.";
        }
        error.textContent = message;
        error.classList.add("visible");
        button.disabled = false;
        button.textContent = "Sign In";
      }
    });
  </script>
</body>
</html>
