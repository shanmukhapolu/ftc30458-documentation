<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Engineering Log | FTC 30458 MasterMinds</title>

  <meta
    name="description"
    content="Private engineering documentation system for FTC 30458 MasterMinds."
  />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="./css/app.css" />

  <style>
    :root {
      --bg: #f7f8fa;
      --surface: rgba(255, 255, 255, 0.92);
      --border: #e5e7eb;
      --text: #16181d;
      --muted: #6b7280;
      --accent: #8b1e3f;
      --accent-dark: #741832;
      --accent-soft: #f8edf1;
      --danger: #b42318;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      font-family: "Inter", sans-serif;
      color: var(--text);
      background:
        radial-gradient(
          circle at 15% 10%,
          rgba(139, 30, 63, 0.08),
          transparent 30%
        ),
        radial-gradient(
          circle at 85% 90%,
          rgba(139, 30, 63, 0.05),
          transparent 28%
        ),
        var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    button,
    input {
      font: inherit;
    }

    .login-shell {
      width: min(100%, 440px);
    }

    .brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand-mark {
      width: 58px;
      height: 58px;
      margin: 0 auto 18px;
      border-radius: 16px;
      background: var(--accent);
      color: white;
      display: grid;
      place-items: center;
      font-family: "Space Grotesk", sans-serif;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.04em;
      box-shadow: 0 12px 28px rgba(139, 30, 63, 0.18);
    }

    .eyebrow {
      margin: 0 0 8px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .brand h1 {
      margin: 0;
      font-family: "Space Grotesk", sans-serif;
      font-size: 30px;
      line-height: 1.05;
      letter-spacing: -0.04em;
    }

    .brand p {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .login-card {
      background: var(--surface);
      border: 1px solid rgba(229, 231, 235, 0.9);
      border-radius: 22px;
      padding: 30px;
      box-shadow:
        0 20px 50px rgba(17, 24, 39, 0.07),
        0 4px 12px rgba(17, 24, 39, 0.03);
      backdrop-filter: blur(16px);
    }

    .card-heading {
      margin-bottom: 22px;
    }

    .card-heading h2 {
      margin: 0;
      font-family: "Space Grotesk", sans-serif;
      font-size: 21px;
      letter-spacing: -0.03em;
    }

    .card-heading p {
      margin: 7px 0 0;
      font-size: 13px;
      line-height: 1.5;
      color: var(--muted);
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 600;
    }

    .field input {
      width: 100%;
      height: 48px;
      padding: 0 14px;
      border: 1px solid #d9dde4;
      border-radius: 12px;
      background: white;
      color: var(--text);
      outline: none;
      transition:
        border-color 0.18s ease,
        box-shadow 0.18s ease;
    }

    .field input::placeholder {
      color: #9ca3af;
    }

    .field input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(139, 30, 63, 0.09);
    }

    .submit-button {
      width: 100%;
      height: 48px;
      margin-top: 4px;
      border: 0;
      border-radius: 12px;
      background: var(--accent);
      color: white;
      font-weight: 700;
      cursor: pointer;
      transition:
        background 0.18s ease,
        transform 0.18s ease,
        box-shadow 0.18s ease;
    }

    .submit-button:hover {
      background: var(--accent-dark);
      box-shadow: 0 10px 22px rgba(139, 30, 63, 0.18);
      transform: translateY(-1px);
    }

    .submit-button:disabled {
      cursor: not-allowed;
      opacity: 0.7;
      transform: none;
      box-shadow: none;
    }

    .error-message {
      display: none;
      margin-top: 14px;
      padding: 11px 12px;
      border: 1px solid #f2c5c2;
      border-radius: 10px;
      background: #fff5f4;
      color: var(--danger);
      font-size: 13px;
      line-height: 1.45;
    }

    .error-message.visible {
      display: block;
    }

    .private-note {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      margin-top: 18px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    .private-note::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: #7d8794;
    }

    .footer {
      margin-top: 20px;
      text-align: center;
      color: #9aa1ab;
      font-size: 11px;
    }

    @media (max-width: 520px) {
      body {
        padding: 16px;
      }

      .login-card {
        padding: 24px 20px;
        border-radius: 18px;
      }

      .brand h1 {
        font-size: 27px;
      }
    }
  </style>
</head>

<body>
  <main class="login-shell">
    <section class="brand">
      <div class="brand-mark">MM</div>

      <p class="eyebrow">FTC 30458</p>

      <h1>Engineering Log</h1>

      <p>
        MasterMinds' engineering documentation system
      </p>
    </section>

    <section class="login-card">
      <div class="card-heading">
        <h2>Team member sign in</h2>
        <p>
          Use your authorized MasterMinds account to access engineering logs
          and season documentation.
        </p>
      </div>

      <form id="login-form">
        <div class="field">
          <label for="email">Email</label>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            placeholder="you@example.com"
            required
          />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            placeholder="Enter your password"
            required
          />
        </div>

        <button
          id="login-button"
          class="submit-button"
          type="submit"
        >
          Sign In
        </button>

        <div
          id="error-message"
          class="error-message"
          role="alert"
        ></div>
      </form>

      <div class="private-note">
        Team members only
      </div>
    </section>

    <footer class="footer">
      FTC 30458 MasterMinds · 2026–27 Season
    </footer>
  </main>

  <script type="module">
    import {
      auth
    } from "./js/firebase.js";

    import {
      onAuthStateChanged,
      signInWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    const loginForm = document.getElementById("login-form");
    const loginButton = document.getElementById("login-button");
    const errorMessage = document.getElementById("error-message");

    function showError(message) {
      errorMessage.textContent = message;
      errorMessage.classList.add("visible");
    }

    function clearError() {
      errorMessage.textContent = "";
      errorMessage.classList.remove("visible");
    }

    // If Firebase restores an existing session, skip the login page.
    onAuthStateChanged(auth, (user) => {
      if (user) {
        window.location.replace("./dashboard.html");
      }
    });

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      clearError();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!email || !password) {
        showError("Enter both your email and password.");
        return;
      }

      loginButton.disabled = true;
      loginButton.textContent = "Signing in…";

      try {
        await signInWithEmailAndPassword(auth, email, password);
        window.location.replace("./dashboard.html");
      } catch (error) {
        console.error("Login failed:", error);

        let message = "Unable to sign in. Check your credentials and try again.";

        switch (error.code) {
          case "auth/invalid-credential":
          case "auth/wrong-password":
          case "auth/user-not-found":
            message = "Incorrect email or password.";
            break;

          case "auth/too-many-requests":
            message =
              "Too many unsuccessful attempts. Try again later.";
            break;

          case "auth/user-disabled":
            message = "This account has been disabled.";
            break;

          case "auth/invalid-email":
            message = "Enter a valid email address.";
            break;
        }

        showError(message);

        loginButton.disabled = false;
        loginButton.textContent = "Sign In";
      }
    });
  </script>
</body>
</html>
