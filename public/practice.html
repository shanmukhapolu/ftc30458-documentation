<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shared Practice Document | FTC 30458 Engineering Log</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="./css/app.css?v=20261118-01"><link rel="icon" href="./favicon.svg" type="image/svg+xml">
</head>
<body>
<div id="app-shell"></div>
<script type="module">
import {requireAuth,attachLogout} from "./js/auth.js?v=20260926-02";
import {renderShell} from "./js/shell.js?v=20261118-01";
import {initializeSharedDocument} from "./js/shared-document.js?v=20261118-01";
requireAuth(async user=>{
  renderShell({active:"practices",title:"Practice document",user});
  document.getElementById("page-content").innerHTML=`
  <div id="document-root" hidden>
    <section class="page-header">
      <a class="btn btn-outline btn-sm" href="./practices.html" style="margin-bottom:18px">← Practices</a>
      <div class="page-header-row"><div class="page-header-copy"><div class="eyebrow">Shared team record</div><h2 id="doc-practice-title" class="page-title">Loading practice…</h2><p id="doc-practice-meta" class="page-subtitle">Loading schedule…</p></div><div class="page-actions"><button id="edit-practice" class="btn btn-outline" type="button">Edit Practice</button><button id="delete-practice" class="btn btn-danger" type="button">Delete Practice</button><span id="doc-review-status" class="chip chip-neutral">Not yet reviewed</span><button id="doc-review-button" class="btn btn-primary" type="button">Mark reviewed</button></div></div>
    </section>
    <div id="future-document-banner" class="notice notice-warning" hidden style="margin-bottom:18px"></div>
    <div class="shared-progress card-shell"><div><div class="eyebrow">Documentation completeness</div><strong id="doc-progress-label">In progress</strong><span id="doc-progress-count">0 / 7 sections</span></div><div class="shared-progress-track"><span id="doc-progress-bar"></span></div><p id="doc-status-note">Any team member can contribute to any section.</p><button id="import-legacy-button" class="btn btn-outline btn-sm" type="button">Import older logs</button></div>
    <section class="card-shell attendance-inline"><div><strong>Your attendance</strong><span id="attendance-status">Loading…</span></div><div class="attendance-actions"><button id="attendance-present" class="btn btn-primary btn-sm" type="button">Present</button><button id="attendance-absent" class="btn btn-outline btn-sm" type="button">Not present</button></div></section>
    <section class="section-head"><div><h2>Work completed</h2><p>Record the team’s work as one shared list. Any member can add or update an item.</p></div></section>
    <section class="card-shell shared-list-card"><div id="work-items" class="shared-item-list"></div><div id="work-form" class="shared-add-form"><input id="work-text" class="form-input" type="text" maxlength="500" placeholder="Describe a completed task or milestone"><select id="work-category" class="form-select"><option>General</option><option>Mechanical</option><option>Programming</option><option>Electrical</option><option>CAD / Design</option><option>Outreach</option><option>Strategy</option><option>Business</option></select><button id="work-add" class="btn btn-primary" type="button">Add work</button></div></section>
    <section class="section-head"><div><h2>Practice documentation</h2><p>Each section is part of the same document and can be completed by any team member.</p></div></section>
    <div id="document-sections" class="shared-sections"></div>
    <section class="section-head"><div><h2>Next-practice action items</h2><p>Carry unfinished work forward. Mark items complete when they are resolved.</p></div></section>
    <section class="card-shell shared-list-card"><div id="next-items" class="shared-item-list"></div><div id="next-form" class="shared-add-form"><input id="next-text" class="form-input" type="text" maxlength="500" placeholder="Add a concrete follow-up action"><select id="next-category" class="form-select"><option>General</option><option>Mechanical</option><option>Programming</option><option>Electrical</option><option>CAD / Design</option><option>Outreach</option><option>Strategy</option><option>Business</option></select><button id="next-add" class="btn btn-primary" type="button">Add next step</button></div></section>
    <section class="section-head"><div><h2>Revision history</h2><p>Recent contributions across the shared practice document.</p></div></section>
    <section id="document-history" class="card-shell history-list"></section>
  </div>`;
  attachLogout("#logout-button");
  initializeSharedDocument(user);
});
</script>
</body></html>
