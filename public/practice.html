<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Practice | FTC 30458 Engineering Log</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/app.css">
</head>
<body>
  <div id="app-shell"></div>

  <div id="log-modal" class="modal-backdrop">
    <div class="modal">
      <div class="modal-header">
        <div><div id="modal-eyebrow" class="eyebrow">Practice log</div><h2 id="modal-title">Member log</h2></div>
        <button id="close-modal" class="modal-close" type="button" aria-label="Close">×</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
      <div id="modal-footer" class="modal-footer"></div>
    </div>
  </div>

  <script type="module">
    import { requireAuth, attachLogout } from "./js/auth.js";
    import { renderShell } from "./js/shell.js";
    import { initializePracticePage } from "./js/practice.js";

    requireAuth(async function(user) {
      renderShell({ active: "practices", title: "Practice", user: user });

      document.getElementById("page-content").innerHTML =
        '<section class="page-header">' +
          '<a id="back-link" class="btn btn-outline btn-sm" href="./practices.html" style="margin-bottom:18px">← Practices</a>' +
          '<div class="page-header-row">' +
            '<div class="page-header-copy"><div id="practice-eyebrow" class="eyebrow">Practice</div><h2 id="practice-title" class="page-title">Loading…</h2>' +
            '<p id="practice-meta" class="page-subtitle">Loading the team record…</p></div>' +
            '<div class="page-actions"><button id="edit-my-log" class="btn btn-primary" type="button">Log / Edit My Work</button></div>' +
          '</div>' +
        '</section>' +

        '<section class="stats-grid">' +
          '<article class="stat-card"><div class="stat-label">Members documented</div><div id="member-progress" class="stat-value">—</div><div class="stat-meta">Live</div></article>' +
          '<article class="stat-card"><div class="stat-label">Work areas</div><div id="work-area-count" class="stat-value">—</div><div class="stat-meta">Across member logs</div></article>' +
          '<article class="stat-card"><div class="stat-label">Major accomplishments</div><div id="accomplishment-count" class="stat-value">—</div><div class="stat-meta">From member logs</div></article>' +
          '<article class="stat-card"><div class="stat-label">Last update</div><div id="last-update" class="stat-value" style="font-size:1.35rem">—</div><div class="stat-meta">Most recent edit</div></article>' +
        '</section>' +

        '<section class="section-head"><div><h2>What the team accomplished</h2><p>Generated directly from each member&apos;s major accomplishment.</p></div></section>' +
        '<section class="card-shell" style="padding:6px 20px;margin-bottom:28px"><div id="accomplishments"></div></section>' +

        '<section class="section-head"><div><h2>Member logs</h2><p>Everyone can read these. Only the author can edit their own.</p></div></section>' +
        '<section id="member-logs" class="member-grid"></section>';

      attachLogout("#logout-button");
      initializePracticePage(user);
    });
  </script>
</body>
</html>
